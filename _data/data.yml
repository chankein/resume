brief:
    title: About Me
    summary: |
      Senior Engineer with over 10 years of experience in server-side development and practical AI/Big-Data projects, aside from server-side development, also has the ability to independently develop iOS and Windows programs.<br/>
      Provide solutions for the Japanese Government, Toyota, SoftBank, Fuji Film(Xerox), nanamusic.<br/>
      <br/>
   

career-profile:
    title: Career Profile
    summary: |
      **Full-Stack Engineer and Data Architect**: Over 10 years of enterprise-level full-stack development and data application experience, proficient in the full Software Development Life Cycle (SDLC), skilled in leading distributed teams, and designing efficient, stable web/mobile applications and data integration solutions to drive business objectives.
      - **Technical Leadership**: Led a 15 engineers team at Line Yahoo group, establishing development standards and processes, managing project timelines and resource allocation, and ensuring on-time delivery of high-performance applications in high-pressure environments.
      - **Data Applications and Integration**: Designed a data platform for a 3.4M daily active user application, increasing retention by 7.67% through A/B testing to support real-time analytics; developed an OCR tool, reducing 10-year manual processing to 4 hours for efficient data integration; led a on-premise data warehouse migration to AWS Redshift, significantly reducing operational costs and enhancing system efficiency.
      - **Core Strengths**:
        - **Technical Expertise**: Proficient in multiple programming languages and frameworks (Python, Java, C#, SwiftUI), selecting optimal tech stacks for efficient development. Skilled in Django, Spring Boot, and Flask frameworks, with extensive experience in cloud deployment and system service management, supporting large-scale distributed systems. Capable of independently designing UI and developing apps using SwiftUI for iOS and C#/WPF frameworks.
        - **Development Process**: Proficient in the full SDLC cycle, covering requirements analysis, design, development, testing, CI/CD, and operations, excelling in Agile/Scrum management to ensure efficient delivery.
      (see project details page:<a href="https://keinchan.com/resume/project.html">https://keinchan.com/resume/project.html</a>):
      <br/>
    changelanguage: 轉中文
    changelanguageurl: https://keinchan.com/resume-zh/ 

experiences:

    - role: Full Stack Technical Consultant & Data Architect
      time: 2022.11 - Present
      company: Amigo Technology Consulting Studio, Tokyo
      details: |
        - **LY Group Data Warehouse Migration**: As the technical lead and project manager, I led the migration of the enterprise-level data platform for Japan's Line Yahoo Group, including completing the full technical solution validation for the migration from the Teradata on-premise data center to AWS Redshift; responsible for migration resource evaluation and project schedule control to ensure timely delivery; developed standardized migration processes and data validation mechanisms to ensure data consistency; coordinated technical alignment and resource allocation within internal business units of the group.Based on peer benchmarks, the project is estimated to reduce operational costs by 35%-45% (covering licenses, hardware, maintenance).
        - **Japanese National Mobility Tracking System**: An internal project for SoftBank, one of Japan's three major telecom companies. By obtaining mobile base station and GPS location data, the project continuously manages the mobile phone location data, forming a data warehouse that covers approximately one-third of Japan's population. Responsible for the verification and investigation of the underlying framework and some visualization tasks. The project involves a large amount of personal information, so strict compliance with personal privacy protection requirements is essential.
        - **Japan Travel Itinerary Generator App(Personal Software Development Project)**: The app automatically plans travel itineraries based on user-input start and end points, modes of transportation, and travel destination information. The project includes: requirement analysis and system architecture planning, UI design, app development, backend development, admin panel development, and web scraping for data collection.
        - **Japan Music Creation App - Nanamusic Project**: Responsible for backend management development and system maintenance, promptly addressing system failures caused by version updates, malicious attacks, etc.
  
    - role: Backend Engineer
      time: 2019.09 - 2022.10
      company: Outsourcing Technology(TSE Code:2427), Tokyo 
      details: |
        Participated as a backend engineer in the Japanese government's family registry digitization project and Toyota Group's smart city TRI-AD (now Woven Planet) development project.
        - Participated in the Japanese government's family registry digitization project led by Fujifilm, developing five Windows applications to assist the family registry department in addressing issues in the digitalization of the family registry system.
          By introducing OCR (Optical Character Recognition) technology, the project converted scanned image-format family registry documents into structured data, improving processing efficiency from the previous 10 years of manual operations to just a few hours. The production environment involved Japanese citizens' family registry data and strictly adhered to Japan's Personal Information Protection Law to ensure the security and compliance of sensitive citizen data.
        - Responsible for the backend development of the smart logistics delivery system for Toyota Group's smart city (Woven City), designing and implementing the core system based on microservices architecture to support the collaborative operation of over 3,000 delivery robots.
      description: | 
        abbr:
        - TRI-AD: Toyota Research Institute - Advanced Development.
        - Woven City: A future city that provides the latest mobility solutions with over 2000 residents built by the Toyota group.
        - OCR: Optical Character Recognition

    - role: Test Development Engineer
      time: 2018.06 - 2019.08
      company: Oriental Kingdom Group, Tokyo
      details: |
        - Responsible for testing the Pepper humanoid robot for corporate applications under SoftBank, leading the test plan design and execution for the Pepper management system. Worked closely with the technical team from the French subsidiary Aldebaran Robotics to coordinate multinational testing processes and track issues, ensuring the stability and functionality of the robot applications meet enterprise-level standards.
      description: |

    - role: Big Data Engineer
      time: 2015.10 - 2018.05
      company: Lama Bang Technology Co., Ltd., Shenzhen
      details: |
        Lama Bang app was one of China's largest maternity and baby social media platforms. In addition to the Lama Bang app, the company also operates apps like Pregnancy Companion, Lama Bang Mall, and Lama Bang U-Select. As a fast-growing unicorn company, Lama Bang faced the challenge of rapidly increasing data volume and how to leverage this data effectively.
        - **Database Architecture Upgrade**: Participated in the design and implementation of a new-generation data warehouse system to support the data analysis needs of the company's products. Successfully addressed the data volume surge challenge brought by the increase in daily active users from 300,000 to 3.4 million, significantly improving data processing and storage efficiency.
        - **Business Intelligence System Development**: Developed an enterprise-grade OSS data platform that automated the calculation and visualization of daily statistical indicators. Over 2,000 data reports were generated annually, providing real-time data support to departments like operations, product, and advertising.
        - **Data-Driven Decision-Making System**: Built a user profiling system and A/B testing framework to support product iteration and user growth strategies, fostering the development of a data-driven culture within the company.
      description: |

    - role: System Engineer
      time: 2014.04 - 2015.09
      company: Lino-A Co, Kyoto
      details: |
        Developed a multilingual, multi-device compatible tourism information system platform using WordPress for visitors. Provided services to the Shimoda City Tourism Association and the Hikone City Tourism Association.

