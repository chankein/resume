projects:
    changelanguage: 轉中文
    changelanguageurl: https://keinchan.com/resume-zh/project.html 
    backToTOp: Click here to Resume Page
    title: Projects
    intro: |
      One of the most common challenges in IT project management and cross-departmental/company coordination is management inefficiencies caused by inaccurate technical and requirement estimations.
      <br/>
      To address this, I have deliberately taken on diverse roles to broaden my expertise and minimize technical blind spots. Additionally, as a team member, I leverage my development experience to fill technical gaps and ensure project success.
      <br/>
      *Click project titles to view related webpages.

    project:
    - title: LY Group Data Warehouse Migration
      link: "https://www.lycorp.co.jp/ja/company/"
      role: "Technical Lead & Project Manager"
      description: |
                  Line Yahoo (LY Group), Japan's largest internet company with flagship products including Line (covering 71% population) and PayPay (66% market share), initiated this strategic migration from on-premise Teradata to AWS Redshift to handle data growth and reduce operational costs.
      KeyAchievements: |
                  1. Cross-division coordination: Orchestrated resources across business units, completing architecture assessment and migration scheduling
                  1. Technical research: Conducted comprehensive analysis of Teradata-Redshift differences, establishing phased migration strategy
                  1. Resource evaluation: Assessed hardware, manpower and timeline requirements for optimal resource allocation
                  1. Standardization: Developed SOP through pilot migration and iterative refinement
                  1. Data consistency: Designed validation standards and automated verification framework with continuous optimization
                  1. Progress monitoring: Real-time tracking and issue resolution throughout migration execution

    - title: Rakuten Pay
      link: "https://payment.rakuten.co.jp/"
      role: "Server-side Tech Lead"
      description: As technical lead for Japan's top-tier payment platform, managed server-side feature iterations and maintenance.
      KeyAchievements: |
                  1. Organized integration meetings with external systems (credit cards/banks), ensuring seamless feature integration
                  2. Implemented Agile project management via Jira, improving task allocation and issue tracking
                  3. Established code review protocols to enhance code quality and maintainability
                  4. Reviewed API documentation and test cases (UT/IT/PT)
                  5. Developed new payment modules and coordinated server-mobile integrations

    - title: Japanese National Mobility Tracking System
      link: "https://www.softbank.jp/biz/services/analytics/ugoki/"
      role: "Big Data Engineer (Tech Lead)"
      description: This telecom analytics project processed mobile base station and GPS data to track and predict mobility patterns across Japan's 120M population, including location distribution and transportation modes.
      KeyAchievements: |
                  1. Led cloud platform selection (Databricks), ensuring smooth migration of legacy systems
                  2. Developed anomaly detection and visualization tools for spatial data analysis
                  3. Implemented data isolation and anonymization to meet strict compliance requirements

    - title: Japan Travel Itinerary Generator App
      link: ""
      role: "Full-stack Engineer"
      description: Independently developed an intelligent travel planning app generating personalized itineraries with navigation, transit routes and schedules based on user inputs.
      KeyAchievements: |
                  1. Full-cycle development from market research to launch
                  2. Designed intuitive UI/UX using Figma
                  3. Built iOS client with SwiftUI, integrating CloudKit and MapKit
                  4. Developed proprietary multi-destination routing algorithm
                  5. Created cross-platform admin system with React Native
                  6. Implemented CI/CD pipeline with cloud infrastructure

    - title: Azas Project
      link: "https://sales.azas-token.com/"
      role: "Technical Consultant & PM"
      description: A digital platform enabling construction workers to report safety issues via mobile app, incorporating real-time rewards to enhance safety culture (Agile development).
      KeyAchievements: |
                  1. Conducted technical feasibility studies and architectural design
                  2. Managed cross-departmental coordination and issue resolution
                  3. Solved React Native compatibility issues across iOS/Android versions

    - title: Nanamusic
      link: "https://nana-music.com/"
      role: "Server-side Engineer"
      description: As core developer for this popular Japanese music creation app, handled architecture design and DevOps using Agile methodology.
      KeyAchievements: |
                  1. Developed RESTful APIs with UT/UI testing frameworks
                  2. Optimized CI/CD pipeline, reducing 3,600+ UI tests from 4hr to 1hr
                  3. Implemented Terraform-based IaC on AWS, reducing human errors
                  4. Established monitoring system with rollback capabilities
                  5. Built copyright management backend improving takedown efficiency

    - title: Japanese Government's Family Registry Digitization (Fujifilm)
      link: "https://www.fujifilm.com/fbss/solution/public/"
      role: "Systems Engineer"
      description: Developed automation solutions for Japan's national registry digitization, implementing OCR and error detection to handle massive data correction workloads.
      KeyAchievements: |
                  1. Translated business requirements into technical solutions
                  2. Managed 120+ database tables across applications
                  3. Designed document structuring system improving OCR accuracy from 65% to 85%
                  4. Created human review interfaces for hybrid processing
                  5. Coordinated SDK-level support with a Russian OCR SDK supplier for Japanese character recognition, ensuring smooth cross-border collaboration
                  6. Enforced strict data compliance policies

    - title: Toyota Smart Logistics (Woven City)
      link: "https://www.woven-city.global/"
      role: "Server-side Engineer"
      description: Developed microservices for the autonomous robot logistics network in Toyota's future smart city (2,000 residents), following Agile methodology.
      KeyAchievements: |
                  1. Designed scalable microservice architecture
                  2. Defined data schemas and API specifications
                  3. Implemented containerization with docker-compose
                  4. Built REST/MQTT/RabbitMQ microservices with Spring Boot
                  5. Developed Flask mock services for parallel testing

    - title: Softbank Pepper Robot Project
      link: "https://www.softbankrobotics.com/jp/product/education/furusato/?_gl=1*y4lqwb*_ga*MjEwNjQ4MDM0LjE3NTA4NDUxOTQ.*_ga_4MD1NXTN7F*czE3NTIwMjc2MjIkbzMkZzAkdDE3NTIwMjc2MjIkajYwJGwwJGgw"
      role: "Test Engineer"
      description: Conducted system testing for Pepper humanoid robot's management system and enterprise applications.
      KeyAchievements: |
                  1. Designed full-cycle test plans (UT/IT/functional)
                  2. Led UAT ensuring release readiness
                  3. Automated testing (Selenium) reducing effort by 87.5%
                  4. Built AWS-based log analysis system
                  5. Served as technical liaison with Aldebaran Robotics
                  6. Managed 200+ issues via Redmine

    - title: Lamabang Business Intelligence
      link: "http://www.lamabang.com/article/detail/m-about.html/"
      role: "Big Data Engineer"
      description: Built data infrastructure for China's leading maternal social platform (3.4M DAU) to enable data-driven decisions.
      KeyAchievements: |
                  1. Implemented 3,400+ tracking points across platforms
                  2. Developed ETL pipelines with SQL/Shell/Python/Scala
                  3. Designed Hadoop warehouse supporting 300K→3.4M DAU growth
                  4. Created real-time visualization dashboards
                  5. Reduced anomaly response time by 80% via automated alerts
                  6. Established ML-based user profiling (7.67% retention lift)
                  7. Designed A/B testing framework for product iteration

